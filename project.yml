# XcodeGen project definition.
#
# The .xcodeproj is NOT committed to git — it is regenerated deterministically
# from this file by running `xcodegen generate` (locally and on every CI run).
# Keep target layout changes here, not in Xcode.

name: BetterContacts

options:
  bundleIdPrefix: com.danielgraviet
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  BetterContacts:
    type: application
    platform: iOS
    sources:
      - path: BetterContacts
    dependencies:
      - target: Domain
    info:
      path: BetterContacts/Info.plist
      properties:
        CFBundleDisplayName: BetterContacts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSContactsUsageDescription: BetterContacts uses your contacts to power filtering, smart reminders, birthdays, and natural language search. Your contacts stay on your device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielgraviet.bettercontacts
        TARGETED_DEVICE_FAMILY: "1"

  Domain:
    type: framework
    platform: iOS
    sources:
      - path: Domain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  DomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DomainTests
      - path: DomainTestSupport
    dependencies:
      - target: Domain
      - target: BetterContacts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  BetterContactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BetterContactsTests
      - path: DomainTestSupport
    dependencies:
      - target: BetterContacts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  BetterContactsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BetterContactsUITests
    dependencies:
      - target: BetterContacts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BetterContacts:
    build:
      targets:
        BetterContacts: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DomainTests
        - BetterContactsTests
        - BetterContactsUITests
