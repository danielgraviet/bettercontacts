name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      # Xcode 26 moved sourcekitdInProc inside the toolchain; the current
      # SwiftLint bottle still expects the pre-26 layout. Bridge it so
      # `swiftlint` can run. No-op when the layout already matches.
      - name: Link sourcekitdInProc where SwiftLint expects it
        run: |
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          SOURCEKIT="$TOOLCHAIN/usr/lib/sourcekitdInProc.framework"
          if [ -e "$SOURCEKIT" ]; then
            for SWIFT_DIR in "$TOOLCHAIN"/usr/lib/swift-*/; do
              if [ ! -e "$SWIFT_DIR/macosx/sourcekitdInProc.framework" ]; then
                sudo mkdir -p "$SWIFT_DIR/macosx"
                sudo ln -sfn "$SOURCEKIT" "$SWIFT_DIR/macosx/sourcekitdInProc.framework"
              fi
            done
          fi

      - name: Lint
        run: swiftlint lint --strict

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install Fastlane
        run: bundle install --jobs 4

      - name: Run tests
        run: bundle exec fastlane test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output
          if-no-files-found: ignore
